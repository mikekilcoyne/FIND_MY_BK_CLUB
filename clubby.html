<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clubby — Breakfast Club International</title>
<style>
  :root {
    color-scheme: light dark;
    --paper: #ececec;
    --card: #ffffff;
    --ink: #111111;
    --ink-soft: #4a4a4a;
    --line: #d4d4d4;
    --accent: #ffd700;
    --accent-ink: #111111;
    --pop: #25d366;
    --shadow: 4px 4px 0 var(--ink);
    --shadow-sm: 3px 3px 0 var(--ink);
    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0a0f18; --card: #121a26; --ink: #f4f4f4; --ink-soft: #a9b3c1;
      --line: #26313f; --shadow: 4px 4px 0 #000; --shadow-sm: 3px 3px 0 #000;
    }
  }
  :root[data-theme="light"] {
    --paper: #ececec; --card: #ffffff; --ink: #111111; --ink-soft: #4a4a4a;
    --line: #d4d4d4; --shadow: 4px 4px 0 var(--ink); --shadow-sm: 3px 3px 0 var(--ink);
  }
  :root[data-theme="dark"] {
    --paper: #0a0f18; --card: #121a26; --ink: #f4f4f4; --ink-soft: #a9b3c1;
    --line: #26313f; --shadow: 4px 4px 0 #000; --shadow-sm: 3px 3px 0 #000;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--font); -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  .wrap {
    max-width: 720px; margin: 0 auto;
    padding: clamp(20px, 5vw, 56px) 20px 120px;
    display: flex; flex-direction: column; align-items: center;
  }

  /* ── Lockup ───────────────────────────────────────────────────────── */
  .lockup { text-align: center; line-height: 0.9; margin-top: clamp(8px, 4vh, 40px); user-select: none; }
  .lockup .l1 {
    font-weight: 700; letter-spacing: -0.02em; text-transform: uppercase;
    font-size: clamp(2.4rem, 12vw, 5.4rem); white-space: nowrap;
  }
  .lockup .l2 { display: block; font-weight: 700; text-transform: uppercase; white-space: nowrap; }

  .tagline {
    margin: 14px 0 clamp(26px, 5vh, 44px);
    font-size: 0.82rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-soft); text-align: center;
  }

  /* ── Thread ───────────────────────────────────────────────────────── */
  #thread { width: 100%; display: flex; flex-direction: column; gap: 18px; }
  .msg { display: flex; gap: 12px; align-items: flex-start; max-width: 100%; }
  .msg.user { justify-content: flex-end; }

  .avatar {
    flex: 0 0 auto; width: 46px; height: 46px;
    border: 2px solid var(--ink); background: var(--card);
    box-shadow: var(--shadow-sm); display: grid; place-items: center;
  }
  .avatar svg { width: 34px; height: 34px; display: block; }

  .bubble {
    border: 2px solid var(--ink); background: var(--card);
    box-shadow: var(--shadow-sm); padding: 14px 16px;
    max-width: 78%; font-size: 1.02rem; line-height: 1.45;
  }
  .bubble b { font-weight: 700; }
  .msg.user .bubble { background: var(--accent); color: var(--accent-ink); border-color: var(--ink); }
  .cursor {
    display: inline-block; width: 0.5ch; height: 1.05em; background: currentColor;
    margin-left: 1px; vertical-align: -0.15em; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

  /* ── Club card ────────────────────────────────────────────────────── */
  .club-card {
    border: 2px solid var(--ink); background: var(--card);
    box-shadow: var(--shadow); margin-top: 10px; width: 100%; overflow: hidden;
  }
  .club-card__top {
    padding: 14px 16px; border-bottom: 2px solid var(--ink);
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
  }
  .club-card__city { font-weight: 700; text-transform: uppercase; font-size: 1.35rem; line-height: 1; }
  .club-card__region {
    font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-soft); white-space: nowrap;
  }
  .club-card__rows { padding: 12px 16px; display: grid; gap: 9px; }
  .row { display: grid; grid-template-columns: 74px 1fr; gap: 10px; font-size: 0.94rem; }
  .row .k {
    font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-soft); padding-top: 3px;
  }
  .club-card__foot { display: flex; border-top: 2px solid var(--ink); }
  .club-card__foot a {
    flex: 1; text-align: center; padding: 12px 8px; font-weight: 700;
    text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.08em;
    text-decoration: none; color: var(--ink); background: var(--card);
    border-right: 2px solid var(--ink);
  }
  .club-card__foot a:last-child { border-right: 0; }
  .club-card__foot a.pop { background: var(--pop); color: #072b13; }
  .club-card__foot a:hover { background: var(--accent); color: var(--accent-ink); }

  .polaroids { display: flex; gap: 10px; padding: 14px 0 4px; flex-wrap: wrap; }
  .polaroid {
    width: 92px; background: #fff; border: 1px solid #cfcfcf;
    padding: 6px 6px 20px; box-shadow: 2px 3px 0 rgba(0,0,0,.28);
    transform: rotate(var(--r, -3deg));
  }
  .polaroid .ph {
    width: 100%; height: 72px; overflow: hidden;
    background: linear-gradient(135deg, var(--accent), #ffb300);
    display: grid; place-items: center; font-size: 1.5rem;
  }
  .polaroid .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .attr { font-size: 0.68rem; color: var(--ink-soft); margin-top: 2px; }
  .bubble a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }

  /* Once the conversation starts, the header gets out of the way (mobile) */
  body.chatting .lockup { margin-top: 4px; }
  /* …but stays clear of the fixed corner toggles on narrow screens */
  @media (max-width: 640px) {
    .lockup, body.chatting .lockup { margin-top: 44px; }
  }
  body.chatting .lockup .l1 { font-size: clamp(1.5rem, 7.5vw, 2.8rem); }
  body.chatting .tagline { margin: 8px 0 18px; font-size: 0.66rem; }

  /* ── Chips ────────────────────────────────────────────────────────── */
  .chips { display: flex; flex-wrap: wrap; gap: 10px; padding-left: 58px; }
  .chips.center { padding-left: 0; justify-content: center; }
  .chip {
    border: 2px solid var(--ink); background: var(--card); color: var(--ink);
    box-shadow: var(--shadow-sm); padding: 9px 14px; font-family: var(--font);
    font-size: 0.86rem; font-weight: 500; cursor: pointer;
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .chip:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--ink); }
  .chip:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 var(--ink); }
  .chip.accent { background: var(--accent); color: var(--accent-ink); }

  /* ── Composer ─────────────────────────────────────────────────────── */
  .composer {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to top, var(--paper) 70%, transparent);
    padding: 14px 20px 20px; display: flex; justify-content: center;
  }
  .composer form { width: 100%; max-width: 680px; display: flex; gap: 10px; }
  .composer input {
    flex: 1; border: 2px solid var(--ink); background: var(--card); color: var(--ink);
    box-shadow: var(--shadow-sm); padding: 14px 16px; font-family: var(--font);
    font-size: 1rem; outline: none;
  }
  .composer input:focus { box-shadow: var(--shadow); }
  .composer button {
    border: 2px solid var(--ink); background: var(--accent); color: var(--accent-ink);
    box-shadow: var(--shadow-sm); padding: 0 20px; font-family: var(--font);
    font-weight: 700; text-transform: uppercase; cursor: pointer; font-size: 0.85rem;
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .composer button:hover { transform: translate(-2px,-2px); box-shadow: var(--shadow); }
  .composer .clip { background: var(--card); padding: 0 15px; font-size: 1.2rem; }

  .theme-toggle {
    position: fixed; top: 14px; right: 16px; z-index: 5;
    border: 2px solid var(--ink); background: var(--card); color: var(--ink);
    width: 40px; height: 40px; box-shadow: var(--shadow-sm); cursor: pointer; font-size: 1rem;
  }
  .style-toggle {
    position: fixed; top: 14px; left: 16px; z-index: 5;
    display: flex; border: 2px solid var(--ink); box-shadow: var(--shadow-sm); background: var(--card);
  }
  .style-toggle button {
    border: 0; background: transparent; color: var(--ink); font-family: var(--font);
    font-weight: 700; text-transform: uppercase; font-size: 0.6rem; letter-spacing: 0.12em;
    padding: 8px 11px; cursor: pointer;
  }
  .style-toggle button[aria-pressed="true"] { background: var(--accent); color: #111; }

  /* ── PHOTO MODE ───────────────────────────────────────────────────── */
  #bgCanvas, .bg-scrim { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -2; display: none; pointer-events: none; }
  #bgCanvas { object-fit: cover; filter: blur(30px) saturate(1.12); transform: scale(1.18); }
  .bg-scrim { z-index: -1; background: linear-gradient(180deg, rgba(28,20,12,.30) 0%, rgba(28,20,12,.55) 100%); }
  body.photo #bgCanvas, body.photo .bg-scrim { display: block; }

  body.photo .lockup, body.photo .tagline { color: #fff; text-shadow: 0 2px 30px rgba(0,0,0,.5); }
  body.photo .tagline { color: rgba(255,255,255,.92); }
  body.photo .bubble {
    background: rgba(255,255,255,.86); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    color: #111; border-color: rgba(255,255,255,.92); box-shadow: 0 12px 38px rgba(0,0,0,.32);
  }
  body.photo .avatar {
    background: rgba(255,255,255,.92); border-color: rgba(255,255,255,.92);
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
  }
  body.photo .msg.user .bubble { background: rgba(255,215,0,.94); border-color: rgba(255,255,255,.9); }
  body.photo .chip {
    background: rgba(255,255,255,.86); color: #111; border-color: rgba(255,255,255,.92);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    box-shadow: 0 8px 24px rgba(0,0,0,.26);
  }
  body.photo .chip:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(0,0,0,.32); }
  body.photo .chip.accent { background: rgba(255,215,0,.95); }
  body.photo .club-card {
    background: rgba(255,255,255,.9); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    color: #111; border-color: rgba(255,255,255,.92); box-shadow: 0 16px 46px rgba(0,0,0,.38);
  }
  body.photo .club-card__top, body.photo .club-card__foot { border-color: rgba(0,0,0,.18); }
  body.photo .club-card__foot a { background: transparent; color: #111; border-color: rgba(0,0,0,.18); }
  body.photo .club-card__foot a.pop { background: var(--pop); color: #072b13; }
  body.photo .composer { background: linear-gradient(to top, rgba(28,20,12,.6) 55%, transparent); }
  body.photo .composer input {
    background: rgba(255,255,255,.92); color: #111; border-color: rgba(255,255,255,.92);
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
  }
  body.photo .style-toggle, body.photo .theme-toggle {
    background: rgba(255,255,255,.88); border-color: rgba(255,255,255,.92); color: #111;
  }

  @media (max-width: 480px) {
    .bubble { max-width: 82%; }
    .chips { padding-left: 0; }
    .row { grid-template-columns: 64px 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
    .chip, .composer button { transition: none; }
  }
</style>

<canvas id="bgCanvas" aria-hidden="true"></canvas>
<div class="bg-scrim" aria-hidden="true"></div>

<div class="style-toggle" role="group" aria-label="Background style">
  <button id="styleClean" aria-pressed="true">Clean</button>
  <button id="stylePhoto" aria-pressed="false">Photo</button>
</div>
<button class="theme-toggle" id="themeToggle" aria-label="Toggle light or dark theme" title="Toggle light / dark">◑</button>

<div class="wrap">
  <div class="lockup" aria-label="Breakfast Club International">
    <span class="l1" id="l1">BREAKFAST&nbsp;CLUB</span>
    <span class="l2" id="l2">INTERNATIONAL</span>
  </div>
  <div class="tagline">Everyone's invited. Especially you.</div>
  <div id="thread"></div>
</div>

<div class="composer">
  <form id="composer" autocomplete="off">
    <button type="button" class="clip" id="clip" title="Attach a photo from your club" aria-label="Attach a photo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.5l-8.5 8.5a6 6 0 0 1-8.5-8.5L12.5 4a4 4 0 0 1 5.7 5.7L9.7 18.2a2 2 0 0 1-2.9-2.9l7.8-7.8"/></svg></button>
    <input id="input" type="text" placeholder="What are you trying to find?" aria-label="Message Clubby" />
    <button type="submit">Ask</button>
  </form>
</div>

<script src="js/club-data.js"></script>
<script>
/* ══ Painted café scene: people around a breakfast table, shot wide open ══ */
function paintScene(){
  const c = document.getElementById("bgCanvas");
  const W = c.width = 1200, H = c.height = 800;
  const x = c.getContext("2d");

  // Warm window light behind the table
  let g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0,   "#f6e2bd");
  g.addColorStop(0.42,"#e8cfa4");
  g.addColorStop(0.72,"#b98f61");
  g.addColorStop(1,   "#6b4a2e");
  x.fillStyle = g; x.fillRect(0,0,W,H);

  // Bright window panes (blown-out morning light)
  x.fillStyle = "rgba(255,247,225,.85)";
  [[70,40],[330,40],[590,40],[850,40]].forEach(([px,py])=>{
    x.fillRect(px, py, 190, 300);
  });
  x.fillStyle = "rgba(255,252,240,.55)";
  x.fillRect(0, 0, W, 150);

  // Hanging pendant lamps
  [[210,120],[600,95],[980,130]].forEach(([lx,ly])=>{
    const lg = x.createRadialGradient(lx,ly,2, lx,ly,90);
    lg.addColorStop(0,"rgba(255,236,180,.95)");
    lg.addColorStop(1,"rgba(255,236,180,0)");
    x.fillStyle = lg; x.beginPath(); x.arc(lx,ly,90,0,7); x.fill();
  });

  // Long table
  const tableY = 560;
  const tg = x.createLinearGradient(0, tableY, 0, H);
  tg.addColorStop(0, "#c99a63");
  tg.addColorStop(1, "#7d5333");
  x.fillStyle = tg;
  x.beginPath();
  x.moveTo(-60, tableY+40); x.lineTo(W+60, tableY+10);
  x.lineTo(W+60, H); x.lineTo(-60, H); x.closePath(); x.fill();

  // Silhouetted people around it — varied skin/clothing, soft shoulders
  const people = [
    { x:120,  y:470, s:1.0,  skin:"#8c5a3c", cloth:"#3c4b63" },
    { x:300,  y:452, s:0.94, skin:"#e0b48c", cloth:"#7d3f3f" },
    { x:470,  y:478, s:1.06, skin:"#5b3a26", cloth:"#4a5f45" },
    { x:660,  y:455, s:0.98, skin:"#f0c9a4", cloth:"#2f3a4a" },
    { x:840,  y:472, s:1.02, skin:"#a9704a", cloth:"#6d5a7d" },
    { x:1030, y:458, s:0.96, skin:"#d9a97e", cloth:"#3f5a52" },
  ];
  people.forEach(p=>{
    x.save(); x.translate(p.x, p.y); x.scale(p.s, p.s);
    // torso / shoulders
    x.fillStyle = p.cloth;
    x.beginPath();
    x.moveTo(-78, 190); x.quadraticCurveTo(-70, 62, 0, 52);
    x.quadraticCurveTo(70, 62, 78, 190); x.closePath(); x.fill();
    // head
    x.fillStyle = p.skin;
    x.beginPath(); x.ellipse(0, 6, 40, 46, 0, 0, 7); x.fill();
    // hair
    x.fillStyle = "rgba(38,24,16,.85)";
    x.beginPath(); x.ellipse(0, -12, 42, 34, 0, Math.PI, 0); x.fill();
    x.restore();
  });

  // Table things: mugs, plates, a little glassware
  const items = [
    [190,600,"#fdf6ea"],[330,585,"#f2e5cf"],[452,612,"#fffaf0"],
    [610,588,"#f6ead6"],[742,606,"#fff8ec"],[905,592,"#f0e2ca"],[1055,610,"#fdf4e6"],
  ];
  items.forEach(([ix,iy,col])=>{
    x.fillStyle = col;
    x.beginPath(); x.ellipse(ix, iy, 34, 15, 0, 0, 7); x.fill();
    x.fillStyle = "rgba(255,255,255,.9)";
    x.beginPath(); x.ellipse(ix-4, iy-26, 17, 20, 0, 0, 7); x.fill();
  });

  // Bokeh — the giveaway that this was shot wide open
  for(let i=0;i<52;i++){
    const bx = Math.random()*W, by = Math.random()*H*0.62, r = 12 + Math.random()*40;
    const bg = x.createRadialGradient(bx,by,0, bx,by,r);
    const warm = Math.random() > 0.35;
    bg.addColorStop(0, warm ? "rgba(255,236,190,.5)" : "rgba(255,255,255,.38)");
    bg.addColorStop(0.72, warm ? "rgba(255,225,160,.16)" : "rgba(255,255,255,.12)");
    bg.addColorStop(1, "rgba(255,255,255,0)");
    x.fillStyle = bg; x.beginPath(); x.arc(bx,by,r,0,7); x.fill();
  }

  // Vignette
  const vg = x.createRadialGradient(W/2,H/2,H*0.3, W/2,H/2,H*0.95);
  vg.addColorStop(0,"rgba(0,0,0,0)");
  vg.addColorStop(1,"rgba(30,18,8,.55)");
  x.fillStyle = vg; x.fillRect(0,0,W,H);
}

/* ── Clubby mascot — shared with clubby-admin.html (mood-based faces) ── */
const EGG_BODY = `<path d="M20 4c6 0 8 4 11 6s5 5 3 9-1 6-3 9-6 6-11 6-9-2-12-5-4-6-3-10-1-6 2-9 7-6 11-6z" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/><circle cx="20" cy="21" r="8" fill="#ffd700" stroke="#111" stroke-width="2"/>`;

const CLUBBY_FACES = {
  neutral: `<svg viewBox="0 0 40 40" aria-hidden="true">${EGG_BODY}
    <circle cx="17.4" cy="20" r="1.5" fill="#111"/><circle cx="22.6" cy="20" r="1.5" fill="#111"/>
    <path d="M16.5 24c1.4 1.6 5.6 1.6 7 0" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round"/>
  </svg>`,
  thinking: `<svg viewBox="0 0 40 40" aria-hidden="true">${EGG_BODY}
    <circle cx="18" cy="19" r="1.4" fill="#111"/><circle cx="23.2" cy="18.3" r="1.4" fill="#111"/>
    <path d="M17 24.5h6" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M24 15.5c1.4-1 2.8-1 3.6-.4" fill="none" stroke="#111" stroke-width="1.3" stroke-linecap="round"/>
  </svg>`,
  happy: `<svg viewBox="0 0 40 40" aria-hidden="true">${EGG_BODY}
    <path d="M15.6 19.6c.8-1.2 2.6-1.2 3.4 0" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M21 19.6c.8-1.2 2.6-1.2 3.4 0" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M16 23.5c1.8 2.6 6.2 2.6 8 0" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round"/>
  </svg>`,
  concerned: `<svg viewBox="0 0 40 40" aria-hidden="true">${EGG_BODY}
    <circle cx="17.4" cy="20.5" r="1.4" fill="#111"/><circle cx="22.6" cy="20.5" r="1.4" fill="#111"/>
    <path d="M15.8 17.6c1-1 2.6-1.2 3.6-.4" fill="none" stroke="#111" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M20.6 17.2c1-.8 2.6-.6 3.6.4" fill="none" stroke="#111" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="20" cy="25" r="1.6" fill="none" stroke="#111" stroke-width="1.4"/>
  </svg>`,
};
const CLUBBY_SVG = CLUBBY_FACES.neutral;
const face = m => CLUBBY_FACES[m] || CLUBBY_FACES.neutral;

/* ── Live data: clubs-map + story-media + flyers + popups ────────────── */
// WhatsApp group invite (from the BC Master doc). Empty = Clubby routes
// people to the host instead. Paste the chat.whatsapp.com link to enable.
const WHATSAPP_GROUP_URL = "";

const DATA = { clubs: [], flyers: [], popups: [], media: [] };

const stripAccents = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");
const normPlace = s => stripAccents(String(s).toLowerCase())
  .replace(/[^a-z0-9\s,-]/g, " ").replace(/\s+/g, " ").trim();
const baseCity = s => normPlace(s).split(",")[0].split(" - ")[0].trim();

const titleCase = s => s.replace(/\b[a-z]/g, ch => ch.toUpperCase())
  .replace(/\b(Nj|Ny|Ca|Uk|Nl|Fr|Es|Dk|Au|Mx|Or|Ma|Mi|Nc|Ct|Dc|Usa)\b/g, m => m.toUpperCase());
const displayName = c => c.displayCity || titleCase(c.city);

function levenshtein(a, b){
  if(Math.abs(a.length - b.length) > 2) return 99;
  const m = a.length, n = b.length;
  let prev = Array.from({length: n + 1}, (_, j) => j);
  for(let i = 1; i <= m; i++){
    const cur = [i];
    for(let j = 1; j <= n; j++){
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}

/* ── Index: club keys and group keys ──────────────────────────────────── */
const CLUB_KEYS = new Map();   // place name → clubs[]
const GROUPS = new Map();      // "country:australia" → { label, clubs[] }

function indexClub(key, club){
  if(!key || key.length < 2) return;
  const list = CLUB_KEYS.get(key) || [];
  if(!list.includes(club)) list.push(club);
  CLUB_KEYS.set(key, list);
}
function indexGroup(key, label, club){
  const g = GROUPS.get(key) || { label, clubs: [] };
  if(!g.clubs.includes(club)) g.clubs.push(club);
  GROUPS.set(key, g);
}

function buildIndex(){
  CLUB_KEYS.clear(); GROUPS.clear();
  DATA.clubs.forEach(c => {
    const full = normPlace(c.city);
    indexClub(full, c);
    indexClub(full.split(",")[0].trim(), c);
    full.split(",")[0].split(" - ").forEach(p => indexClub(p.trim(), c));

    const geo = GEO[normPlace(c.city)] || {};
    if(geo.country) indexGroup("country:" + geo.country, titleCase(geo.country), c);
    if(geo.state) indexGroup("state:" + geo.state, STATE_LABEL[geo.state] || titleCase(geo.state), c);
    if(c.region) indexGroup("region:" + c.region.toLowerCase(), c.region, c);
  });
}

/* ── Resolve: the one entry point for "where do they mean?" ────────────
   Returns {kind:"club"|"multi"|"group"|"confirm"} or null. */
function groupFor(key){
  const co = COUNTRY_WORDS[key], st = STATE_WORDS[key], rg = REGION_WORDS[key];
  if(co && GROUPS.has("country:" + co)) return GROUPS.get("country:" + co);
  if(st && GROUPS.has("state:" + st)) return GROUPS.get("state:" + st);
  if(rg && GROUPS.has("region:" + rg.toLowerCase())) return GROUPS.get("region:" + rg.toLowerCase());
  return null;
}

function asHit(list, label){
  if(!list || !list.length) return null;
  return list.length === 1 ? { kind:"club", club:list[0] } : { kind:"multi", list, label };
}

function exactLookup(key){
  const k = ALIASES[key] || key;
  const g = groupFor(k) || groupFor(key);
  if(g) return g.clubs.length === 1
    ? { kind:"club", club:g.clubs[0] }
    : { kind:"group", list:g.clubs, label:g.label };
  return asHit(CLUB_KEYS.get(k), titleCase(k));
}

/* Best fuzzy candidate across club names, countries, states and regions. */
function fuzzyLookup(key){
  if(key.length < 3) return null;
  let best = null;
  const consider = (cand, make) => {
    const d = levenshtein(key, cand);
    if(d <= 2 && (!best || d < best.d)) best = { d, cand, make };
  };
  for(const k of CLUB_KEYS.keys()) consider(k, () => asHit(CLUB_KEYS.get(k), titleCase(k)));
  for(const w of Object.keys(COUNTRY_WORDS)) if(w.length >= 4) consider(w, () => exactLookup(w));
  for(const w of Object.keys(STATE_WORDS))   if(w.length >= 4) consider(w, () => exactLookup(w));
  for(const w of Object.keys(REGION_WORDS))  if(w.length >= 4) consider(w, () => exactLookup(w));
  for(const w of Object.keys(ALIASES))       if(w.length >= 4) consider(w, () => exactLookup(w));
  if(!best) return null;
  const hit = best.make();
  if(!hit) return null;
  // Thumb-typo territory: one wrong character on a longer word is safe to accept.
  if(best.d === 1 && best.cand.length >= 6) return hit;
  return { kind:"confirm", target:hit, label:titleCase(best.cand) };
}

/* "melbourne australia", "portland oregon", "cambridge ma" — a city plus a
   modifier. Intersect the two so the right chapter wins. */
function comboLookup(words){
  let places = null, group = null;
  for(const w of words){
    const g = groupFor(ALIASES[w] || w);
    if(g && !group){ group = g; continue; }
    const list = CLUB_KEYS.get(ALIASES[w] || w);
    if(list && !places){ places = list; }
  }
  if(places && group){
    const both = places.filter(c => group.clubs.includes(c));
    if(both.length) return asHit(both, titleCase(words.join(" ")));
  }
  if(places) return asHit(places, titleCase(words.join(" ")));
  if(group) return group.clubs.length === 1
    ? { kind:"club", club:group.clubs[0] }
    : { kind:"group", list:group.clubs, label:group.label };
  return null;
}

function resolvePlace(raw){
  const key = normPlace(raw);
  if(!key) return null;

  const direct = exactLookup(key);
  if(direct) return direct;

  const words = key.split(" ").filter(Boolean);

  // multi-word phrases first ("new south wales", "surf coast")
  for(let n = Math.min(3, words.length); n >= 2; n--){
    for(let i = 0; i + n <= words.length; i++){
      const phrase = words.slice(i, i + n).join(" ");
      const hit = exactLookup(phrase);
      if(hit) return hit;
    }
  }

  const combo = comboLookup(words);
  if(combo) return combo;

  // substring ("amsterdamn", "sanfrancisco")
  if(key.length >= 4){
    for(const [k, list] of CLUB_KEYS){
      if(k.length >= 4 && (key.includes(k) || k.includes(key))) return asHit(list, titleCase(k));
    }
  }

  // single words, longest first
  const sorted = words.slice().sort((a, b) => b.length - a.length);
  for(const w of sorted){ const hit = exactLookup(w); if(hit) return hit; }

  // finally, spelling
  const fz = fuzzyLookup(key);
  if(fz) return fz;
  for(const w of sorted){ const f = fuzzyLookup(w); if(f) return f; }
  return null;
}

/* Back-compat for callers that just want a club or a chapter list. */
function findClub(q){
  const r = resolvePlace(q);
  if(!r) return null;
  if(r.kind === "club") return { club: r.club };
  if(r.kind === "multi" || r.kind === "group") return { multi: r.list, label: r.label };
  return null;
}

const ORDINALS = ["", "1st", "2nd", "3rd", "4th", "Last"];
const WEEKDAYS = ["", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
function whenText(c){
  const s = c.schedule;
  let out = "";
  if(s && s.weekday){
    const day = WEEKDAYS[s.weekday] || "";
    if(s.type === "monthly" && s.ordinal) out = `${ORDINALS[s.ordinal] || ""} ${day}, monthly`;
    else if(s.type === "weekly") out = `Every ${day}`;
    else if(s.type === "biweekly") out = `Every other ${day}`;
  }
  if(!out) out = "See the latest flyer";
  if(c.upcoming_date && c.upcoming_date >= new Date().toISOString().slice(0, 10)){
    const d = new Date(c.upcoming_date + "T12:00:00");
    out += ` · Next: ${d.toLocaleDateString("en-US", { month: "short", day: "numeric" })}`;
  }
  return out;
}

/* Chapter-aware key: "NY - Hamptons" / "new york - hamptons" both → "hamptons";
   "Maplewood, NJ" → alias → "soma". Sources name cities differently — never
   assume a straight join. */
function placeKey(s){
  const b = normPlace(s).split(",")[0].trim();
  const parts = b.split(" - ");
  const last = parts[parts.length - 1].trim();
  return ALIASES[last] || last;
}
function flyerFor(c){
  const key = placeKey(c.city);
  return DATA.flyers
    .filter(f => placeKey(f.city) === key)
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""))[0] || null;
}
function mediaFor(c){
  const key = placeKey(c.city);
  return DATA.media.find(m => {
    const slug = normPlace(m.slug || "").replace(/-/g, " ");
    return slug && (slug === key || slug.includes(key) || key.includes(slug));
  }) || null;
}
function haversine(lat1, lon1, lat2, lon2){
  const R = 6371, d = Math.PI / 180;
  const a = Math.sin((lat2-lat1)*d/2)**2 +
    Math.cos(lat1*d) * Math.cos(lat2*d) * Math.sin((lon2-lon1)*d/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

async function loadData(){
  // no-store: Clubby always answers from the latest data, never a stale cache
  const get = async (url, fallback) => {
    try { const r = await fetch(url, { cache: "no-store" }); return r.ok ? await r.json() : fallback; }
    catch { return fallback; }
  };
  const [clubs, media, flyers, popups] = await Promise.all([
    get("data/clubs-map.json", []),
    get("data/club-story-media.json", { clubs: {} }),
    get("data/flyer-wall.json", []),
    get("data/popups-sample.json", { items: [] }),
  ]);
  DATA.clubs = Array.isArray(clubs) ? clubs : [];
  DATA.media = Object.values(media.clubs || {});
  DATA.flyers = Array.isArray(flyers) ? flyers : (flyers.items || flyers.flyers || []);
  DATA.popups = (popups.items || []).filter(p => !p.date || p.date >= new Date().toISOString().slice(0, 10));
  // Live host edits (venue moved, new time) sit in Netlify Blobs as overrides —
  // merge them on top so Clubby never quotes a stale card.
  if(window.BKClubData){
    try {
      await BKClubData.loadLiveClubOverrides();
      const ov = window.CLUB_OVERRIDES || {};
      DATA.clubs = DATA.clubs.map(c => {
        const patch = ov[BKClubData.normalizeCityKey(c.city)] ||
                      ov[BKClubData.normalizeCityKey(c.displayCity)] || {};
        return { ...c, ...patch };
      });
    } catch (_e) { /* offline/local: base data still works */ }
  }
  buildIndex();
}


/* ── Engine ─────────────────────────────────────────────────────────── */
const thread = document.getElementById("thread");
const input  = document.getElementById("input");
const el = (t,c,h)=>{ const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
const scroll = ()=> window.scrollTo({ top: document.body.scrollHeight, behavior:"smooth" });
const esc = s => String(s == null ? "" : s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function userMsg(text){
  // The user has taken the turn: snap any in-flight type-out to its finished
  // text (without firing its chips) and clear chips left over from before.
  interrupt();
  if(!document.body.classList.contains("chatting")){
    document.body.classList.add("chatting"); fitLockup();
  }
  const m = el("div","msg user"); m.appendChild(el("div","bubble", esc(text)));
  thread.appendChild(m); scroll();
}
function clubbyMsg(html, after, mood){
  const m = el("div","msg clubby");
  m.appendChild(el("div","avatar", face(mood)));
  const b = el("div","bubble"); m.appendChild(b);
  thread.appendChild(m); scroll();
  typeInto(b, html, ()=>{ if(after) after(); scroll(); });
}
let activeType = null;   // the type-out currently running, if any
function typeInto(node, html, done){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ node.innerHTML = html; done&&done(); return; }
  const tokens = html.split(/(<[^>]+>)/).filter(Boolean);
  const cursor = el("span","cursor"); node.appendChild(cursor);
  let ti = 0, stopped = false;
  const end = ()=>{ stopped = true; if(activeType === self) activeType = null; cursor.remove(); };
  const self = { skip(){ if(stopped) return; end(); node.innerHTML = html; } };
  activeType = self;
  (function nextToken(){
    if(stopped) return;
    if(ti >= tokens.length){ end(); done&&done(); return; }
    const tok = tokens[ti++];
    if(tok.startsWith("<")){
      node.insertBefore(document.createRange().createContextualFragment(tok), cursor);
      nextToken(); return;
    }
    let ci = 0;
    (function ch(){
      if(stopped) return;
      if(ci >= tok.length){ nextToken(); return; }
      node.insertBefore(document.createTextNode(tok[ci++]), cursor);
      setTimeout(ch, 12 + Math.random()*20);
    })();
  })();
}
// Called when the user takes the turn. Finishes the in-flight bubble as plain
// text and drops its `after` callback, so a stale chip row can't appear under
// the new answer. Also clears any chips still on screen from an earlier turn.
function interrupt(){
  if(activeType) activeType.skip();
  thread.querySelectorAll(".chips").forEach(r=> r.remove());
}
function chipRow(items, center){
  const row = el("div","chips" + (center?" center":""));
  items.forEach(it=>{
    const c = el("button","chip"+(it.accent?" accent":""), it.label);
    c.onclick = ()=>{ row.remove(); it.action(); };
    row.appendChild(c);
  });
  thread.appendChild(row); scroll(); return row;
}
function say(text, then){ userMsg(text); setTimeout(then, 260); }

/* Where "Host / RSVP" actually goes.
   Host email addresses were removed from data/clubs-map.json on 2026-11-18 --
   that file is served publicly, so it was handing out 27 hosts' personal
   addresses to anyone who fetched it. The mailto-the-host path went with them.

   The old fallback was `c.link || "map-view.html"`, which looked safe but was
   not: 26 of those 27 clubs have `link` set to the Breakfast Club homepage, so
   RSVP quietly became a button that reloads the site you are already on. The
   homepage is treated as "no link" here for that reason.

   HQ is the honest destination for now -- a real address, a real human, the
   club named in the subject so it can be forwarded. The better fix is a relay
   function (same shape as submit-club-update.js: form -> function -> SendGrid)
   so a visitor can write to the host without the address reaching the browser.
   See README section 12. */
const RSVP_FALLBACK_EMAIL = "ben@breakfastclubbing.com";

function isGenericLink(url){
  const u = String(url || "").trim().replace(/\/+$/, "");
  if (!u) return true;
  return /^https?:\/\/(www\.)?(breakfastclubbing\.com|breakfastclubinternational\.com|findmybreakfast\.club)$/i.test(u);
}

function rsvpLinkFor(c){
  if (c.email){
    return `mailto:${c.email}?subject=${encodeURIComponent(`Breakfast Club ${displayName(c)} — count me in`)}`;
  }
  if (!isGenericLink(c.link)) return c.link;
  const host = (c.host || "").split("(")[0].trim();
  const subject = `Breakfast Club ${displayName(c)} — count me in`;
  const body =
    `Hi — I'd like to come to the next Breakfast Club in ${displayName(c)}` +
    (host ? ` (${host}'s club)` : "") + `.\n\n` +
    `Could you put me in touch with the host?\n`;
  return `mailto:${RSVP_FALLBACK_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

function clubCardHTML(c){
  const fl = flyerFor(c);
  const mapURL = c.mapsURL ||
    `https://maps.google.com/?q=${encodeURIComponent(`${c.venue || ""} ${displayName(c)}`)}`;
  const rsvpURL = rsvpLinkFor(c);
  const flyerHTML = fl
    ? `<a href="${fl.url}" target="_blank" rel="noopener">Flyer</a>`
    : `<a href="flyers.html">Flyer</a>`;
  return `<div class="club-card">
    <div class="club-card__top">
      <span class="club-card__city">${esc(displayName(c))}</span>
      <span class="club-card__region">${esc(c.region || "")}</span>
    </div>
    <div class="club-card__rows">
      <div class="row"><span class="k">Host</span><span class="v">${esc(c.host || "Breakfast Club HQ")}</span></div>
      <div class="row"><span class="k">Where</span><span class="v">${esc(c.venue || "See the latest flyer")}</span></div>
      <div class="row"><span class="k">When</span><span class="v">${esc(whenText(c))}</span></div>
    </div>
    <div class="club-card__foot">
      <a href="${mapURL}" target="_blank" rel="noopener">Map</a>
      ${flyerHTML}
      <a class="pop" href="${rsvpURL}">Host / RSVP</a>
    </div>
  </div>`;
}

function coreChips(){
  chipRow([
    { label:"Is there a club in my city?", accent:true,
      action:()=>{ input.focus(); input.placeholder = "Type your city…"; } },
    { label:"What even happens at one?", action:()=> say("What even happens at one?", whatAnswer) },
    { label:"I want to start one", action:()=> say("I want to start one", startFlow) },
    { label:"Latest flyers", action:()=> say("Show me the latest flyers", ()=> flyerAnswer("")) },
  ]);
}

function whatAnswer(){
  clubbyMsg(`Picture ~20 people, one long café table, good coffee, and zero small talk about the weather. People share what they're building or figuring out, make a real friend or two, and leave weirdly energized for a Saturday. Tell me your city and I'll show you the nearest one.`, coreChips, "happy");
}

function metaAnswer(){
  clubbyMsg(`I'm <b>Clubby</b> — an Egg-Moji. Kinda an egg, kinda an emoji, kinda your personal Breakfast Club robot assistant. My whole job is getting you to a long table with good people before noon. Where are you?`, coreChips, "happy");
}

function showClub(c, prefix){
  const m = el("div","msg clubby");
  m.appendChild(el("div","avatar", face("happy")));
  const b = el("div","bubble");
  b.innerHTML = (prefix || `Found it. Here's <b>${esc(displayName(c))}</b>.`) + clubCardHTML(c);
  m.appendChild(b); thread.appendChild(m); scroll();
  chipRow([
    { label:"What do they talk about?", accent:true,
      action:()=> say("What do they talk about?", ()=> talkAnswer(c)) },
    { label:"How do I RSVP?", action:()=> say("How do I RSVP?", ()=> rsvpAnswer(c)) },
    { label:"Show me another city",
      action:()=> clubbyMsg(`Type any city and I'll check the roster — all ${DATA.clubs.length} clubs are in there.`, coreChips) },
  ]);
}

/* One place for every resolved location: club card, chapter picker, or a
   "did you mean" confirm when the spelling was close but not certain. */
function deliverPlace(hit){
  if(hit.kind === "confirm"){
    clubbyMsg(`I've got <b>${esc(hit.label)}</b> — is that it?`, ()=>{
      chipRow([
        { label:`Yes, ${hit.label}`, accent:true,
          action:()=> say("Yes", ()=> deliverPlace(hit.target)) },
        { label:"No, let me retype",
          action:()=>{ input.focus(); input.placeholder = "Try the city name…"; } },
      ]);
    }, "thinking");
    return;
  }
  if(hit.kind === "club"){
    clubbyMsg(`One sec — checking the roster…`,
      ()=> setTimeout(()=> showClub(hit.club), 380), "thinking");
    return;
  }
  showGroup(hit.list, hit.label, hit.kind === "group");
}

function showGroup(list, label, isRegion){
  const noun = isRegion ? "clubs" : "chapters";
  clubbyMsg(`<b>${esc(titleCase(label))}</b> has ${list.length} ${noun} — pick one:`, ()=>{
    chipRow(list.slice(0, 8).map((c, i)=>({
      label: displayName(c), accent: i === 0,
      action: ()=> say(displayName(c), ()=> showClub(c)),
    })));
  }, "happy");
}

function showMulti(list, label){
  clubbyMsg(`<b>${esc(titleCase(label))}</b> has ${list.length} chapters — pick one:`, ()=>{
    chipRow(list.map((c, i)=>({
      label: displayName(c), accent: i === 0,
      action: ()=> say(displayName(c), ()=> showClub(c)),
    })));
  }, "happy");
}

function talkAnswer(c){
  const media = mediaFor(c);
  const shots = media ? (media.photos || (media.photo ? [media.photo] : [])).slice(0, 3) : [];
  const photoHTML = shots.length
    ? `<div class="polaroids">${shots.map((p, i) =>
        `<div class="polaroid" style="--r:${(i - 1) * 4}deg"><div class="ph"><img src="${p}" alt="${esc(displayName(c))} breakfast" loading="lazy"></div></div>`
      ).join("")}</div>${media.attribution ? `<div class="attr">${esc(media.attribution)}</div>` : ""}`
    : "";
  clubbyMsg(`Real conversation before noon — what people are building, figuring out, or plotting next. Every club has its own flavor; ${esc(displayName(c).split(",")[0].split(" - ").pop())} sets its own table.${photoHTML}`, ()=>{
    chipRow([
      { label:"This looks cool — how do I go?", accent:true,
        action:()=> say("How do I go?", ()=> rsvpAnswer(c)) },
      { label:"See what clubs talked about",
        action:()=>{ location.href = `what-we-talked-about.html?city=${encodeURIComponent(c.city)}`; } },
    ]);
  }, "happy");
}

function rsvpAnswer(c){
  const host = (c.host || "the host").split("(")[0].trim();
  // Three cases, because the button no longer always reaches the host directly
  // -- see rsvpLinkFor(). Clubby must not promise a line to someone it hasn't got.
  const how = c.email
    ? `the green <b>Host / RSVP</b> button on the card opens a note straight to <b>${esc(host)}</b>`
    : (!isGenericLink(c.link)
        ? `the green <b>Host / RSVP</b> button on the card takes you to where they're keeping track`
        : `the green <b>Host / RSVP</b> button on the card writes to HQ, and they'll put you in touch with <b>${esc(host)}</b>`);
  clubbyMsg(`Easiest way: ${how}. Say you found the club through the site — first-timers always get a warm welcome. That's kind of the whole point.`, ()=>{
    chipRow([
      { label:"Draft my intro note", accent:true,
        action:()=> say("Draft my intro note", ()=> clubbyMsg(introNote(c), coreChips)) },
      { label:"Join the WhatsApp group",
        action:()=> say("How do I join the group chat?", whatsappAnswer) },
    ]);
  });
}

function introNote(c){
  const first = c ? esc((c.host || "").split("(")[0].trim().split(" ")[0]) : "";
  const where = c ? ` in ${esc(displayName(c).split(",")[0])}` : "";
  return `Here's one to copy:<br><br>"Hi${first ? " " + first : ""}! Found the Breakfast Club through the site — I'd love to come to the next one${where}. Anything I should bring besides an appetite?"<br><br>Short, warm, works every time. Want it more casual, or more professional?`;
}

function whatsappAnswer(){
  if(WHATSAPP_GROUP_URL){
    clubbyMsg(`Right this way — <a href="${WHATSAPP_GROUP_URL}" target="_blank" rel="noopener"><b>join the Breakfast Club WhatsApp group</b></a>. Say hi when you land.`, coreChips, "happy");
  } else {
    clubbyMsg(`The group chat runs through each club's host — RSVP to your city's club and they'll pull you in. Which city are you in?`, ()=>{
      chipRow([
        { label:"Find my city", accent:true,
          action:()=>{ input.focus(); input.placeholder = "Type your city…"; } },
        { label:"Find the nearest club", action: geoNearest },
      ]);
    });
  }
}

function flyerAnswer(n){
  const guess = cityFrom(n);
  const r = guess ? resolvePlace(guess) : null;
  // a country/state/region asked for flyers — show one per club in that group
  if(r && (r.kind === "group" || r.kind === "multi")){
    const rows = r.list.map(c => ({ c, f: flyerFor(c) })).filter(x => x.f);
    if(rows.length){
      clubbyMsg(`Latest flyers across <b>${esc(titleCase(r.label))}</b>:<br>${rows.slice(0, 6).map(x =>
        `• <a href="${x.f.url}" target="_blank" rel="noopener">${esc(displayName(x.c))}</a>${x.f.date ? ` (${esc(x.f.date)})` : ""}`
      ).join("<br>")}<br><br>Everything lives on the <a href="flyers.html"><b>Fly-er Wall</b></a>.`, coreChips, "happy");
      return;
    }
  }
  const club = r && (r.kind === "club" ? r.club : (r.list && r.list[0]));
  const fl = club && flyerFor(club);
  if(fl){
    clubbyMsg(`Latest <b>${esc(displayName(club))}</b> flyer, hot off the wall — <a href="${fl.url}" target="_blank" rel="noopener"><b>open it</b></a>${fl.date ? ` (${esc(fl.date)})` : ""}. The full collection is on the <a href="flyers.html"><b>Fly-er Wall</b></a>.`, coreChips, "happy");
    return;
  }
  const latest = DATA.flyers.slice()
    .sort((a, b)=> (b.date || "").localeCompare(a.date || "")).slice(0, 3);
  if(!latest.length){
    clubbyMsg(`The flyers live on the <a href="flyers.html"><b>Fly-er Wall</b></a> — every city, every month.`, coreChips);
    return;
  }
  clubbyMsg(`Fresh off the wall:<br>${latest.map(f=>`• <a href="${f.url}" target="_blank" rel="noopener">${esc(f.city)}</a>${f.date ? ` (${esc(f.date)})` : ""}`).join("<br>")}<br><br>The full collection lives on the <a href="flyers.html"><b>Fly-er Wall</b></a>.`, coreChips, "happy");
}

function popupAnswer(n){
  // "what's happening in Berlin?" — a named city wins over the generic list
  const guess = cityFrom(n || "");
  const named = guess && DATA.popups.filter(p => placeKey(p.city) === placeKey(guess));
  if(named && named.length){
    const p = named[0];
    clubbyMsg(`Yes — <b>${esc(p.headline)}</b> in ${esc(p.city)}, ${esc(p.date)}${p.time ? `, ${esc(p.time)}` : ""}.<br>${esc(p.venue || "")}${p.rsvpURL ? `<br><br><a href="${p.rsvpURL}" target="_blank" rel="noopener"><b>RSVP here</b></a>` : ""}`, coreChips, "happy");
    return;
  }
  if(guess){
    const hit = findClub(guess);
    if(hit && hit.club){ showClub(hit.club, `Here's what's happening in <b>${esc(displayName(hit.club))}</b>.`); return; }
    if(hit && hit.multi){ showMulti(hit.multi, hit.label); return; }
  }
  if(!DATA.popups.length){
    clubbyMsg(`No one-time pop-ups on the calendar right now — but the regular clubs run every month. Tell me a city and I'll check.`, coreChips);
    return;
  }
  clubbyMsg(`Coming up:<br>${DATA.popups.slice(0, 4).map(p=>
    `• <b>${esc(p.headline)}</b> — ${esc(p.city)}, ${esc(p.date)}${p.rsvpURL ? ` · <a href="${p.rsvpURL}" target="_blank" rel="noopener">RSVP</a>` : ""}`
  ).join("<br>")}`, coreChips, "happy");
}

function writeAnswer(){
  clubbyMsg(`Writing is my cardio. I can do:<br>• <b>Invite copy</b> for your next breakfast<br>• A <b>flyer headline</b> in the Breakfast Club voice<br>• Your <b>intro note</b> to a host<br>• A recap caption<br><br>Tell me the city and the vibe, and I'll draft it.`, ()=>{
    chipRow([
      { label:"Draft an intro note", accent:true,
        action:()=> say("Draft my intro note", ()=> clubbyMsg(introNote(null), coreChips)) },
      { label:"Something else", action:()=>{ input.focus(); } },
    ]);
  }, "happy");
}

function updateAnswer(){
  clubbyMsg(`Got it — let's fix it. Tell me the <b>club</b> and <b>what changed</b> (time, venue, host, cadence) and I'll send it to the update queue and ping the host. Hosts can also do this themselves in the <a href="clubby-admin.html"><b>host chat</b></a>.`, coreChips);
}

function photoDemo(){
  clubbyMsg(`Love that. Drop a photo from your last breakfast and I'll <b>auto-attach it to your club</b> — it lands on your city's wall and can headline the next flyer. Which club should it go to?`, coreChips, "happy");
}

function noClub(place){
  clubbyMsg(`No Breakfast Club in <b>${esc(place)}</b>… <i>yet</i>. Which honestly might be your cue.`, ()=>{
    chipRow([
      { label:"Find the nearest one", accent:true, action: geoNearest },
      { label:"I'll start one", action:()=> say("I'll start one", startFlow) },
      { label:"See all clubs on the map", action:()=>{ location.href = "map-view.html"; } },
    ]);
  }, "concerned");
}

function geoNearest(){
  userMsg("Find the nearest one");
  if(!navigator.geolocation || !DATA.clubs.length){
    clubbyMsg(`I can't read your location here — but the <a href="map-view.html"><b>map view</b></a> shows every club at once.`, coreChips, "concerned");
    return;
  }
  clubbyMsg(`Checking the map…`, null, "thinking");
  navigator.geolocation.getCurrentPosition(pos=>{
    const { latitude: la, longitude: lo } = pos.coords;
    const best = DATA.clubs
      .filter(c=> c.latitude != null && c.longitude != null)
      .map(c=> ({ c, d: haversine(la, lo, c.latitude, c.longitude) }))
      .sort((a, b)=> a.d - b.d)[0];
    if(!best){
      clubbyMsg(`Couldn't work that out — try the <a href="map-view.html"><b>map view</b></a>.`, coreChips, "concerned");
      return;
    }
    const dist = best.d < 50 ? "basically around the corner" : `about ${Math.round(best.d)} km away`;
    showClub(best.c, `Closest to you: <b>${esc(displayName(best.c))}</b> — ${dist}.`);
  }, ()=> clubbyMsg(`No luck with location — the <a href="map-view.html"><b>map view</b></a> has every club.`, coreChips, "concerned"));
}

/* ── Start-a-club: guided chat (Starter Kit deck, condensed) ─────────── */
const START = {};
let pendingAsk = null;

function startFlow(){
  clubbyMsg(`YES. Starting one is genuinely simple — pick a café, pick a morning, invite a few people. I'll walk you through it in three questions.<br><br>First: <b>what city</b> are we putting on the map?`, ()=>{
    pendingAsk = startCity; input.placeholder = "Your city…"; input.focus();
  }, "happy");
}
function startCity(v){
  START.city = v.trim();

  if(existing && existing.club){
    pendingAsk = null; input.placeholder = "What are you trying to find?";
    showClub(existing.club, `Plot twist — <b>${esc(displayName(existing.club))}</b> already exists. Join first, start your own chapter after.`);
    return;
  }
  clubbyMsg(`<b>${esc(START.city)}</b> — love it. When's the first one? A rough date, or "first Saturday next month" is plenty.`, ()=>{
    pendingAsk = startDate; input.placeholder = "A rough date…";
  }, "happy");
}
function startDate(v){
  START.date = v.trim();
  clubbyMsg(`Got it. Last one: <b>which café</b>? You want a long table, good coffee, and a host who won't mind twenty happy people. (You can change it later.)`, ()=>{
    pendingAsk = startCafe; input.placeholder = "Café name…";
  });
}
function startCafe(v){
  START.cafe = v.trim();
  pendingAsk = null; input.placeholder = "What are you trying to find?";
  clubbyMsg(`That's everything. Your launch kit:<br><br>• The <a href="assets/breakfast-club-starter-kit-hosts.pdf" download><b>Starter Kit PDF</b></a> — the full playbook<br>• Your first invite, ready to send:<br><br>"Breakfast Club is coming to <b>${esc(START.city)}</b>. ${esc(START.cafe)}, ${esc(START.date)}, 9am-ish. One long table, good coffee, real conversation. Everyone's invited — especially you."<br><br>Send that to five people and you have a club. Then email <a href="mailto:set@breakfastclubbing.com"><b>set@breakfastclubbing.com</b></a> and we'll put ${esc(START.city)} on the map.`, coreChips, "happy");
}

/* ── Routing ────────────────────────────────────────────────────────── */
const norm = s => s.toLowerCase().trim().replace(/[?.!,'’"]/g, "").replace(/\s+/g, " ");
const FILLER = /\b(is|are|there|a|an|the|any|club|clubs|breakfast|in|at|near|around|me|my|city|town|whats|what|do|you|have|find|show|latest|please|for|one|got|hows|happening|happenings|going|on|pop|ups|popup|popups|event|events|flyer|flyers|poster|posters|im|i|anything|something|about|tell|know|coming|up|next|when|where|s|australian|american|british|european|mate|moving|to|going|live|living)\b/g;
const cityFrom = s => {
  const stripped = norm(s).replace(FILLER, " ").replace(/\s+/g, " ").trim();
  return stripped || norm(s);
};

function logMiss(q){
  try {
    fetch("/.netlify/functions/log-clubby-miss", {
      method: "POST", keepalive: true,
      body: JSON.stringify({ q, ts: new Date().toISOString() }),
    }).catch(()=>{});
  } catch (_e) { /* logging must never break the chat */ }
}

function route(raw){
  const n = norm(raw); if(!n) return;
  if(/whats ?app|group chat|join the (chat|group)|\bthe group\b/.test(n)){ whatsappAnswer(); return; }
  if(/\bfly-? ?ers?\b|\bposters?\b/.test(n)){ flyerAnswer(n); return; }
  if(/pop-? ?ups?\b|\bone.time\b|\bhappening\b|\bevents?\b/.test(n)){ popupAnswer(n); return; }
  if(/\b(write|writing|draft|caption|invite copy|recap)\b/.test(n)){ writeAnswer(); return; }
  if(/\b(update|wrong|fix|out of date|moved|new time|new venue|change the)\b/.test(n)){ updateAnswer(); return; }
  if(/\b(photo|picture|upload|attach|image)\b/.test(n)){ photoDemo(); return; }
  if(/\bstart (one|a club|my own)\b|\bbecome a host\b|\bhost one\b|\blaunch a club\b|\bnew club\b|\bill start\b/.test(n)){ startFlow(); return; }
  if(/\b(what happens|what is it|whats it like|who goes|who attends|what do (they|people) (do|talk))\b/.test(n)){ whatAnswer(); return; }
  if(/\b(who|what) are you\b|\bare you (a |an )?(bot|robot|egg|human)\b/.test(n)){ metaAnswer(); return; }
  if(/^(hi|hey|hello|yo|sup|good morning|gm|morning)\b/.test(n) && n.split(" ").length <= 3){
    clubbyMsg(`Morning. Tell me a city and I'll check the roster — or tap a chip.`, coreChips, "happy"); return;
  }
  if(/\b(thanks|thank you|cheers)\b/.test(n)){
    clubbyMsg(`Anytime. That's what breakfast robots are for.`, coreChips, "happy"); return;
  }
  const guess = cityFrom(n);
  const hit = resolvePlace(guess) || resolvePlace(n);
  if(hit){ deliverPlace(hit); return; }
  // no club there, but a pop-up might be — Lisbon, Berlin et al live only there
  const pop = DATA.popups.find(p => guess && placeKey(p.city) === placeKey(guess));
  if(pop){ popupAnswer(guess); return; }
  logMiss(raw);
  if(/^[a-z\s-]{3,30}$/.test(guess) && guess.split(" ").length <= 4){ noClub(titleCase(guess)); return; }
  clubbyMsg(`Hm — that one's not in my cookbook yet. Here's what I'm great at:`, coreChips, "concerned");
}

document.getElementById("composer").addEventListener("submit", e=>{

  if(pendingAsk){ const fn = pendingAsk; pendingAsk = null; setTimeout(()=> fn(v), 260); return; }
  setTimeout(()=> route(v), 260);
});

/* ── Lockup fit: INTERNATIONAL spans BREAKFAST CLUB ─────────────────── */
function fitLockup(){
  const l1 = document.getElementById("l1"), l2 = document.getElementById("l2");
  // l2 is block-level, so getBoundingClientRect() returns the container width,
  // not the text width. Measure the text itself with a Range.
  const textWidth = node => {
    const r = document.createRange(); r.selectNodeContents(node);
    return r.getBoundingClientRect().width;
  };
  // Keep line 1 inside the viewport first (mobile), then fit line 2 to it.
  l1.style.fontSize = "";
  const wrap = document.querySelector(".wrap");
  const avail = (wrap ? wrap.clientWidth : innerWidth) - 40;
  const w1 = textWidth(l1);
  if(avail > 0 && w1 > avail){
    l1.style.fontSize = (parseFloat(getComputedStyle(l1).fontSize) * avail / w1) + "px";
  }
  const target = textWidth(l1);
  const base = parseFloat(getComputedStyle(l1).fontSize) * 0.5;
  l2.style.fontSize = base + "px";
  l2.style.letterSpacing = "0px";
  l2.style.paddingLeft = "0px";
  const natural = textWidth(l2);
  if(!target || !natural) return;
  if(natural > target){
    l2.style.fontSize = (base * (target / natural)) + "px";
    return;
  }
  // letter-spacing adds a gap after every glyph (including the last), so
  // divide by the full character count and pad the left to re-center.
  const extra = (target - natural) / "INTERNATIONAL".length;
  l2.style.letterSpacing = extra + "px";
  l2.style.paddingLeft = extra + "px";
}
window.addEventListener("resize", fitLockup);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitLockup);
