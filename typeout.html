<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breakfast Club Journey</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #020202;
        --fg: #ffffff;
        --panel: rgba(8, 8, 8, 0.36);
        --panel-line: rgba(255, 255, 255, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      body {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
        color: var(--fg);
      }

      .video-bg {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.08), transparent 28%),
          #000000;
      }

      .video-bg iframe,
      .video-bg video {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 177.78vh;
        height: 56.25vw;
        min-width: 100vw;
        min-height: 100vh;
        transform: translate(-50%, -50%);
        border: 0;
        pointer-events: none;
      }

      .video-fallback {
        display: none;
        object-fit: cover;
      }

      .video-bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.24) 0%, rgba(0, 0, 0, 0.48) 100%),
          radial-gradient(circle at center, rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.42));
      }

      .journey-shell {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: grid;
        align-items: end;
        padding: clamp(24px, 4vw, 48px);
      }

      .journey-copy {
        width: min(100%, 1100px);
        padding: clamp(22px, 3vw, 34px);
        border: 1px solid var(--panel-line);
        background: var(--panel);
        backdrop-filter: blur(14px) saturate(0.9);
        -webkit-backdrop-filter: blur(14px) saturate(0.9);
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.28);
      }

      .journey-kicker {
        margin: 0 0 12px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.72);
      }

      .journey-line {
        margin: 0;
        font-size: clamp(42px, 7vw, 92px);
        font-weight: 700;
        line-height: 0.97;
        letter-spacing: -0.055em;
        text-wrap: balance;
      }

      .journey-line-typed {
        white-space: pre-wrap;
      }

      .journey-cursor {
        display: inline-block;
        width: 0.085em;
        height: 0.9em;
        margin-left: 0.08em;
        vertical-align: -0.08em;
        background: rgba(255, 255, 255, 0.94);
        animation: blink 1s steps(1, end) infinite;
      }

      .journey-line.is-complete .journey-cursor {
        animation-duration: 1.2s;
      }

      .journey-meta {
        margin: 18px 0 0;
        font-size: 13px;
        line-height: 1.45;
        color: rgba(255, 255, 255, 0.7);
      }

      @keyframes blink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0;
        }
      }

      @media (max-width: 700px) {
        .journey-shell {
          align-items: center;
        }

        .journey-copy {
          padding: 20px 18px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .journey-cursor {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="video-bg" aria-hidden="true">
      <iframe
        id="journey-vimeo"
        src="https://player.vimeo.com/video/1188402707?h=395d38bcf4&background=1&autopause=0&controls=0&muted=1&loop=1&title=0&byline=0&portrait=0"
        allow="autoplay; fullscreen; picture-in-picture"
        title="Breakfast Club background video"
      ></iframe>
      <video
        id="journey-video-fallback"
        class="video-fallback"
        autoplay
        muted
        loop
        playsinline
      >
        <source src="/Volumes/PortableSSD/Breakfast_Qwest_Dumps/260501/Canon/142___04/MVI_3385.MOV" type="video/quicktime" />
      </video>
    </div>

    <main class="journey-shell">
      <section class="journey-copy" aria-label="Journey intro">
        <p class="journey-kicker">Paris Journey</p>
        <h1
          id="journey-line"
          class="journey-line"
          aria-label="What if building a global community was easy...?"
        >
          <span
            id="journey-line-typed"
            class="journey-line-typed"
            aria-hidden="true"
          >What if building a global community was easy...?</span><span class="journey-cursor" aria-hidden="true"></span>
        </h1>
        <p class="journey-meta">Full-screen Vimeo background with a type-out intro moment.</p>
      </section>
    </main>

    <script>
      (function () {
        const text = "What if building a global community was easy...?";
        const durationMs = 3600;
        const startDelayMs = 220;
        const line = document.getElementById("journey-line");
        const typed = document.getElementById("journey-line-typed");
        const iframe = document.getElementById("journey-vimeo");
        const fallbackVideo = document.getElementById("journey-video-fallback");

        if (!line || !typed) return;

        const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (prefersReducedMotion) {
          typed.textContent = text;
          line.classList.add("is-complete");
        } else {
          typed.textContent = "";
          const startAt = performance.now() + startDelayMs;

          function tick(now) {
            if (now < startAt) {
              window.requestAnimationFrame(tick);
              return;
            }

            const elapsed = now - startAt;
            const progress = Math.min(elapsed / durationMs, 1);
            const nextLength = Math.round(text.length * progress);
            typed.textContent = text.slice(0, nextLength);

            if (progress < 1) {
              window.requestAnimationFrame(tick);
              return;
            }

            typed.textContent = text;
            line.classList.add("is-complete");
          }

          window.requestAnimationFrame(tick);
        }

        window.setTimeout(() => {
          if (!iframe || !fallbackVideo) return;
          fallbackVideo.style.display = "block";
        }, 3200);
      })();
    </script>
  </body>
</html>
