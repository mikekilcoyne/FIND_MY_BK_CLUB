<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>This Week's Flyers — Breakfast Club</title>
  <link rel="icon" type="image/svg+xml" href="./assets/bk-club-icon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #f5f0ea;
      color: #1c1710;
      min-height: 100vh;
      padding: 40px 20px 80px;
    }

    .page-wrap { max-width: 960px; margin: 0 auto; }

    .page-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo {
      display: inline-block;
      background: #1c1710;
      color: #f5f0ea;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      line-height: 1.1;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(22px, 5vw, 36px);
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #7a6850;
      margin-bottom: 28px;
    }

    .dl-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #1c1710;
      color: #f5f0ea;
      border: none;
      border-radius: 10px;
      padding: 13px 24px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s;
    }
    .dl-btn:hover { background: #2d2518; }
    .dl-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .week-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #7a6850;
      margin-bottom: 20px;
    }

    .flyer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .flyer-card {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .flyer-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }

    .flyer-card img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      display: block;
      background: #f0ebe3;
    }

    .flyer-card-meta {
      padding: 10px 12px 12px;
    }

    .flyer-city {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
    }

    .flyer-dl-link {
      display: block;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #7a6850;
      text-decoration: none;
      padding: 6px 0;
      border: 1px solid #ddd5c8;
      border-radius: 6px;
      transition: background 0.12s, color 0.12s;
    }
    .flyer-dl-link:hover { background: #1c1710; color: #f5f0ea; border-color: #1c1710; }

    .empty { text-align: center; padding: 60px 20px; color: #7a6850; font-size: 15px; }

    .status { text-align: center; padding: 40px; color: #7a6850; font-size: 14px; }

    footer {
      text-align: center;
      margin-top: 60px;
      font-size: 12px;
      color: #9e8c7a;
    }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <div class="page-wrap">
    <div class="page-header">
      <a href="/" class="logo">BREAKFAST<br>CLUB</a>
      <h1>This Week's Fly-Ers</h1>
      <p class="subtitle">Download, share, post — spread the word.</p>
      <button class="dl-btn" id="dl-all-btn" onclick="downloadAll()">⬇ Download All</button>
    </div>

    <p class="week-label" id="week-label"></p>
    <div id="flyer-grid" class="flyer-grid"></div>
  </div>

  <footer>
    <a href="/">breakfastclubbing.com</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script>
    const grid = document.getElementById('flyer-grid');
    const weekLabel = document.getElementById('week-label');
    let loadedItems = [];

    async function init() {
      grid.innerHTML = '<div class="status">Loading flyers…</div>';
      try {
        const res = await fetch('/.netlify/functions/get-public-flyers?days=7');
        const data = await res.json();
        loadedItems = data.items || [];

        if (!loadedItems.length) {
          grid.innerHTML = '<div class="empty">No flyers uploaded this week yet — check back soon.</div>';
          document.getElementById('dl-all-btn').disabled = true;
          return;
        }

        const now = new Date();
        weekLabel.textContent = `Week of ${now.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })} · ${loadedItems.length} flyer${loadedItems.length !== 1 ? 's' : ''}`;

        // Sort newest first, dedupe adjacent same-club
        const sorted = [...loadedItems].sort((a, b) => new Date(b.uploadedAt) - new Date(a.uploadedAt));
        const deduped = dedupeAdjacent(sorted);

        grid.innerHTML = deduped.map(f => {
          const url = `/.netlify/functions/get-flyer?key=${encodeURIComponent(f.key)}`;
          const dlUrl = url + '&download=1';
          return `<div class="flyer-card">
            <img src="${url}" alt="${f.club || 'Flyer'}" loading="lazy">
            <div class="flyer-card-meta">
              <div class="flyer-city">${f.club || '—'}</div>
              <a href="${dlUrl}" download="${f.key}" class="flyer-dl-link">⬇ Download</a>
            </div>
          </div>`;
        }).join('');
      } catch (err) {
        grid.innerHTML = `<div class="empty">Couldn't load flyers: ${err.message}</div>`;
      }
    }

    function dedupeAdjacent(items) {
      const result = [...items];
      for (let i = 0; i < result.length - 1; i++) {
        if (result[i].club === result[i+1].club) {
          for (let j = i+2; j < result.length; j++) {
            if (result[j].club !== result[i].club) {
              [result[i+1], result[j]] = [result[j], result[i+1]];
              break;
            }
          }
        }
      }
      return result;
    }

    async function downloadAll() {
      if (!loadedItems.length) return;
      const btn = document.getElementById('dl-all-btn');
      btn.disabled = true;
      btn.textContent = 'Preparing…';
      try {
        const zip = new JSZip();
        await Promise.all(loadedItems.map(async f => {
          const res = await fetch(`/.netlify/functions/get-flyer?key=${encodeURIComponent(f.key)}`);
          zip.file(f.key, await res.arrayBuffer());
        }));
        const blob = await zip.generateAsync({ type: 'blob' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `bk-flyers-${new Date().toISOString().split('T')[0]}.zip`;
        a.click();
        URL.revokeObjectURL(a.href);
      } catch (err) {
        alert('Download failed: ' + err.message);
      }
      btn.disabled = false;
      btn.textContent = '⬇ Download All';
    }

    init();
  </script>
</body>
</html>
