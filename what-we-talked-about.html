<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latest Happenings — Breakfast Club</title>
    <link rel="icon" type="image/svg+xml" href="./assets/bk-club-icon.svg" />
    <link rel="stylesheet" href="./css/design-tokens.css?v=20260603" />
    <link rel="stylesheet" href="./css/word-cloud.css?v=20260523" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        background: #0a0a0f;
      }
      #clubs-list { display: none; }

      /* ── V3-style preamble eyebrow ── */
      .wc-overlay-preamble-row { margin-bottom: 0.4rem; }
      .wc-overlay-preamble {
        font-size: clamp(0.5rem, 1.1vw, 0.7rem) !important;
        font-weight: 400 !important;
        letter-spacing: 4px !important;
        text-transform: uppercase !important;
        color: rgba(255,255,255,0.45) !important;
        font-style: italic;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        white-space: normal;
        transition: color 0.18s ease;
      }
      .wc-overlay-preamble:hover { color: rgba(255,255,255,0.85) !important; }
      .wc-overlay-preamble-note {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: rgba(255,215,0,0.9);
        color: #000;
        flex-shrink: 0;
      }
      .wc-overlay-preamble-note svg { display: block; }
      .wc-overlay-preamble-caret { display: none; }

      /* ── V3-style city name: huge, bold, uppercase ── */
      .wc-overlay-city-row {
        position: relative;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 0;
      }
      .wc-overlay-city-button {
        font-size: clamp(2.2rem, 7vw, 90px) !important;
        font-weight: var(--weight-bold) !important;
        letter-spacing: -1px !important;
        line-height: 0.9 !important;
        text-transform: uppercase !important;
        color: #fff !important;
        text-shadow: 0 2px 14px rgba(0,0,0,0.55) !important;
        background: none !important;
        border: none !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        padding: 0 !important;
        cursor: default;
        white-space: nowrap;
        text-align: center;
        grid-column: 2;
        justify-self: center;
      }
      .wc-overlay-city-button:hover { background: none !important; box-shadow: none !important; }
      .wc-overlay-city-button__label { pointer-events: none; }

      /* ── NEW badge ── */
      .lh-new-badge {
        grid-column: 3;
        justify-self: start;
        align-self: center;
        margin-left: 0.7rem;
        background: none;
        color: #ffd700;
        font-family: inherit;
        font-size: 0.62rem;
        font-weight: var(--weight-bold, 700);
        letter-spacing: 3px;
        text-transform: uppercase;
        padding: 0.18rem 0.5rem;
        border: 1px solid rgba(255,215,0,0.55);
        border-radius: 999px;
        white-space: nowrap;
      }
      .lh-new-badge[hidden] { display: none; }

      /* ── View icon buttons (shuffle / list / grid) ── */
      .lh-view-icons {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        margin: 1rem auto 0;
        flex-shrink: 0;
        flex-wrap: wrap;
      }
      .lh-icon-btn {
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.22);
        border-radius: 999px;
        padding: 0.5rem 0.95rem;
        cursor: pointer;
        color: #fff;
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
        line-height: 1;
      }
      .lh-icon-btn:hover { background: rgba(255,255,255,0.2); transform: translateY(-1px); }
      .lh-icon-btn.is-active {
        background: #ffd700;
        border-color: #ffd700;
        color: #000;
      }
      .lh-icon-btn svg { display: block; }
      .lh-icon-label {
        font-family: inherit;
        font-size: 0.72rem;
        font-weight: var(--weight-bold, 700);
        letter-spacing: 0.5px;
      }

      /* V3 header: left-aligned, interactive */
      .wc-overlay-header {
        text-align: center !important;
        pointer-events: auto !important;
        padding: clamp(24px, 5vh, 48px) clamp(24px, 5vw, 60px) 16px !important;
      }
      .wc-overlay-preamble-row { text-align: center; }
      .wc-overlay-meta {
        display: block;
        text-align: center;
        font-size: clamp(0.92rem, 2.6vw, 1.12rem) !important;
        letter-spacing: 1px;
        line-height: 1.4;
        color: rgba(255,255,255,0.82) !important;
        margin-top: 0.6rem;
      }

      /* ── Exit-door button (bottom-left, opposite Notes bubble) ── */
      .wc-exit-door {
        position: fixed;
        left: clamp(16px, 4vw, 32px);
        bottom: clamp(16px, 4vw, 32px);
        top: auto !important;
        right: auto !important;
        z-index: 45;
        width: 52px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border-radius: 50%;
        border: none;
        background: rgba(8,16,32,0.55);
        color: #fff;
        box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        cursor: pointer;
        transition: transform 0.2s ease, background 0.2s ease;
      }
      .wc-exit-door:hover { transform: translateY(-3px); background: rgba(8,16,32,0.7); }
      .wc-exit-door svg { display: block; }

      /* ── Swipe affordance ── */
      .wc-swipe-hint {
        position: absolute;
        left: 50%;
        top: 0;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(8,16,32,0.5);
        color: rgba(255,255,255,0.92);
        font-family: inherit;
        font-size: 0.72rem;
        font-weight: var(--weight-bold, 700);
        letter-spacing: 1px;
        pointer-events: none;
        opacity: 0;
        animation: wc-swipe-fade 3.4s ease forwards;
      }
      .wc-swipe-hint[hidden] { display: none; }
      .wc-swipe-hint svg { display: block; animation: wc-swipe-nudge 1.3s ease-in-out infinite; }
      @keyframes wc-swipe-fade {
        0% { opacity: 0; } 14% { opacity: 1; } 78% { opacity: 1; } 100% { opacity: 0; }
      }
      @keyframes wc-swipe-nudge {
        0%, 100% { transform: translateX(0); } 50% { transform: translateX(3px); }
      }

      /* Hide prev/next arrows + dots — swipe + thumbnails replace them */
      .wc-overlay-nav { display: none !important; }
      .wc-overlay-photo-dots { display: none !important; }

      /* Topics no longer scatter on the stage — they live in the Notes popup. */
      #wc-overlay-stage.wc-overlay-stage { pointer-events: none; }

      /* ── Topics chat-bubble trigger ── */
      .wc-topics-bubble {
        position: fixed;
        right: clamp(16px, 4vw, 32px);
        bottom: clamp(16px, 4vw, 32px);
        z-index: 45;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: none;
        background: #ffd700;
        color: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(0,0,0,0.45);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .wc-topics-bubble:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,0.55); }
      .wc-topics-bubble svg { display: block; }
      .wc-topics-bubble[hidden] { display: none; }

      /* ── Notes-app popup ── */
      .wc-notes-backdrop {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: rgba(0,0,0,0.55);
        backdrop-filter: blur(3px);
      }
      .wc-notes {
        position: fixed;
        z-index: 61;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        width: min(440px, 94vw);
        max-height: 80vh;
        background: #f7f6f1;
        border-radius: 18px 18px 0 0;
        box-shadow: 0 -10px 50px rgba(0,0,0,0.4);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        animation: wc-notes-up 0.32s cubic-bezier(0.16,1,0.3,1);
      }
      .wc-notes[hidden], .wc-notes-backdrop[hidden] { display: none; }
      @keyframes wc-notes-up { from { transform: translate(-50%, 100%); } to { transform: translate(-50%, 0); } }
      .wc-notes__bar {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.7rem 1rem;
        border-bottom: 1px solid rgba(0,0,0,0.08);
        background: #efeee8;
      }
      .wc-notes__dot { width: 10px; height: 10px; border-radius: 50%; background: #ffcf4a; }
      .wc-notes__title {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: rgba(0,0,0,0.45);
      }
      .wc-notes__close {
        margin-left: auto;
        background: none;
        border: none;
        color: #d39a00;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 0.82rem;
        font-weight: 700;
        cursor: pointer;
      }
      .wc-notes__sheet { padding: 1.4rem 1.5rem 2rem; overflow-y: auto; }
      .wc-notes__heading {
        margin: 0 0 0.2rem;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 1.15rem;
        font-weight: 700;
        color: #1a1a1a;
      }
      .wc-notes__date {
        margin: 0 0 1.1rem;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 0.72rem;
        color: rgba(0,0,0,0.4);
      }
      .wc-notes__list { margin: 0; padding: 0; list-style: none; }
      .wc-notes__list li {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 0.96rem;
        line-height: 1.55;
        color: #2a2a2a;
        padding: 0.35rem 0 0.35rem 1.4rem;
        position: relative;
      }
      .wc-notes__list li::before {
        content: "—";
        position: absolute;
        left: 0;
        color: #d39a00;
      }
      .wc-notes__caret {
        display: inline-block;
        width: 2px;
        height: 1em;
        margin-left: 2px;
        background: #d39a00;
        vertical-align: -0.15em;
        animation: wc-notes-blink 0.9s step-end infinite;
      }
      @keyframes wc-notes-blink { 50% { opacity: 0; } }

      /* ── Thumbnail strip (sits just below the tiny dots) ── */
      .wc-overlay-photo-thumbs {
        position: absolute;
        z-index: 9;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        max-width: 92vw;
        padding: 0 16px;
        pointer-events: auto;
      }
      .wc-overlay-photo-thumbs[hidden] { display: none; }
      .wc-overlay-photo-thumb {
        width: 46px;
        height: 46px;
        padding: 0;
        border: 2px solid rgba(255,255,255,0.25);
        border-radius: 4px;
        overflow: hidden;
        background: #111;
        cursor: pointer;
        opacity: 0.55;
        transition: opacity 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        flex-shrink: 0;
      }
      .wc-overlay-photo-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .wc-overlay-photo-thumb:hover { opacity: 0.85; transform: translateY(-2px); }
      .wc-overlay-photo-thumb.is-active {
        opacity: 1;
        border-color: #ffd700;
      }
      @media (max-width: 600px) {
        .wc-overlay-preamble {
          letter-spacing: 2px !important;
          font-size: 0.55rem !important;
        }
        .wc-overlay-photo-thumb { width: 40px; height: 40px; flex: 0 0 auto; }
        .wc-overlay-photo-thumbs {
          flex-wrap: nowrap;
          overflow-x: auto;
          justify-content: center;
          gap: 6px;
          padding: 0 12px;
          -webkit-overflow-scrolling: touch;
        }
        .lh-icon-btn { padding: 0.45rem 0.8rem; }
        .lh-icon-label { font-size: 0.68rem; }
      }

      /* Hide the old emoji swap buttons — replaced by icons */
      .wc-overlay-club-swap-pointer { display: none !important; }

      /* ── Picker panels (list + grid) ── */
      .lh-picker {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.97);
        z-index: 40;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 4rem 3rem 3rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.28s ease;
        overflow-y: auto;
      }
      .lh-picker.is-open {
        opacity: 1;
        pointer-events: auto;
      }
      .lh-picker__inner {
        width: 100%;
        max-width: 900px;
      }
      .lh-picker__back {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        background: none;
        border: none;
        color: rgba(255,255,255,0.25);
        cursor: pointer;
        padding: 0;
        margin-top: 2.5rem;
        transition: color 0.2s;
        display: block;
      }
      .lh-picker__back:hover { color: #fff; }

      /* List picker: region header + city row */
      .lh-list-region {
        border-top: 1px solid rgba(255,255,255,0.07);
      }
      .lh-list-region:last-child { border-bottom: 1px solid rgba(255,255,255,0.07); }
      .lh-list-row {
        display: flex;
        align-items: baseline;
        gap: 0;
      }
      .lh-list-region-label {
        font-size: 0.52rem;
        font-weight: 700;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: rgba(255,255,255,0.18);
        width: 100px;
        flex-shrink: 0;
        padding: 0.9rem 0;
        pointer-events: none;
        cursor: default;
      }
      .lh-list-cities {
        display: flex;
        flex-wrap: wrap;
        gap: 0;
        flex: 1;
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .lh-list-city-btn {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: clamp(0.65rem, 1.6vw, 0.82rem);
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: rgba(255,255,255,0.42);
        background: none;
        border: none;
        padding: 0.6rem 1.3rem 0.6rem 0;
        cursor: pointer;
        transition: color 0.15s ease;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
      }
      .lh-list-city-btn:hover { color: #fff; }
      .lh-list-new-dot {
        font-size: 0.5rem;
        font-weight: 700;
        letter-spacing: 1.5px;
        color: #000;
        background: #ffd700;
        padding: 0.15rem 0.4rem;
        text-transform: uppercase;
        flex-shrink: 0;
      }

      /* Grid picker */
      .lh-grid-title {
        font-size: clamp(1.6rem, 4vw, 3rem);
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #fff;
        margin: 0 0 0.4rem;
        text-shadow: 0 4px 20px rgba(0,0,0,0.8);
      }
      .lh-grid-subtitle {
        font-size: 0.82rem;
        color: rgba(255,255,255,0.4);
        margin: 0 0 2.5rem;
        letter-spacing: 1px;
      }
      .lh-cities-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 1.5rem;
        width: 100%;
        padding-bottom: 4rem;
      }
      .lh-city-card {
        position: relative;
        aspect-ratio: 16/10;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.12);
        background: #111;
        cursor: pointer;
        transition: transform 0.4s cubic-bezier(0.16,1,0.3,1),
                    border-color 0.3s ease,
                    box-shadow 0.4s ease;
      }
      .lh-city-card::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.1) 60%);
        z-index: 2;
        pointer-events: none;
      }
      .lh-city-card-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
        transition: transform 0.55s cubic-bezier(0.16,1,0.3,1);
      }
      .lh-city-card:hover {
        transform: translateY(-4px);
        border-color: rgba(255,255,255,0.5);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }
      .lh-city-card:hover .lh-city-card-img { transform: scale(1.05); }
      .lh-city-card-info {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        padding: 1rem;
        z-index: 3;
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
      }
      .lh-city-card-name {
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #fff;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        transition: color 0.25s ease;
      }
      .lh-city-card:hover .lh-city-card-name { color: #ffd700; }
      .lh-city-card-schedule {
        font-size: 0.65rem;
        color: rgba(255,255,255,0.45);
        text-transform: uppercase;
        letter-spacing: 1.5px;
      }
      .lh-city-card-badge {
        position: absolute;
        top: 0.8rem;
        right: 0.8rem;
        z-index: 3;
        font-size: 0.55rem;
        font-weight: 700;
        letter-spacing: 1.5px;
        color: #000;
        background: #ffd700;
        padding: 0.18rem 0.45rem;
        text-transform: uppercase;
      }

      @media (max-width: 600px) {
        .lh-picker { padding: 3rem 1.5rem 2rem; }
        .lh-list-region-label { width: 64px; font-size: 0.48rem; }
        .lh-list-city-btn { font-size: 0.65rem; padding-right: 0.8rem; }
        .lh-cities-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.8rem; }
      }
    </style>

        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
          <path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-5 4V6a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <circle cx="9" cy="11" r="1" fill="currentColor"/>
          <circle cx="12.5" cy="11" r="1" fill="currentColor"/>
          <circle cx="16" cy="11" r="1" fill="currentColor"/>
        </svg>
      </button>

      <!-- Notes-app topics popup -->
      <div class="wc-notes-backdrop" id="wc-notes-backdrop" hidden></div>
      <div class="wc-notes" id="wc-notes" role="dialog" aria-modal="true" aria-label="What we talked about" hidden>
        <div class="wc-notes__bar">
          <span class="wc-notes__dot"></span>
          <span class="wc-notes__title">Notes</span>
          <button class="wc-notes__close" id="wc-notes-close" type="button" aria-label="Close">Done</button>
        </div>
        <div class="wc-notes__sheet">
          <p class="wc-notes__heading" id="wc-notes-heading"></p>
          <p class="wc-notes__date" id="wc-notes-date"></p>
          <ul class="wc-notes__list" id="wc-notes-list"></ul>
        </div>
      </div>

      <div class="wc-overlay-header">
        <div class="wc-overlay-preamble-row">
          <span class="wc-overlay-preamble" id="wc-overlay-preamble" role="button" tabindex="0" aria-label="See what we talked about">
            <span id="wc-overlay-preamble-text">What we talked about...</span>
            <span class="wc-overlay-preamble-note" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="11" height="11" fill="none">
                <path d="M5 4h14a1 1 0 0 1 1 1v9l-4 4H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              </svg>
            </span>
          </span>
        </div>
        <div class="wc-overlay-city-row">
          <!-- hidden swap pointers — kept for JS compatibility -->
          <button class="wc-overlay-club-swap-pointer" id="wc-overlay-swap-club-prev" type="button" aria-label="Previous club" hidden>👈</button>
          <button class="wc-overlay-city wc-overlay-city-button" id="wc-overlay-city" type="button" aria-label="Change club">
            <span class="wc-overlay-city-button__label" id="wc-overlay-city-label"></span>
          </button>
          <button class="wc-overlay-club-swap-pointer" id="wc-overlay-swap-club-next" type="button" aria-label="Next club" hidden>👉</button>
          <!-- NEW badge -->
          <span class="lh-new-badge" id="lh-new-badge">New</span>
        </div>
        <span class="wc-overlay-meta" id="wc-overlay-meta"></span>
        <span class="wc-overlay-source-date" id="wc-overlay-source-date" hidden></span>

        <!-- View icons (under sub-header) -->
        <div class="lh-view-icons">
          <button class="lh-icon-btn" id="lh-shuffle" title="Shuffle">
            <svg width="18" height="14" viewBox="0 0 18 14" fill="none" aria-hidden="true">
              <path d="M11.5 1L14.5 1L14.5 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M3.5 1H6C7.5 1 8.5 3 9 3.5C9.5 4 10.5 6 12 6H14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M11.5 13L14.5 13L14.5 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M3.5 13H6C7.5 13 8.5 11 9 10.5C9.5 10 10.5 8 12 8H14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span class="lh-icon-label">Shuffle</span>
          </button>
          <button class="lh-icon-btn" id="lh-list-view" title="List View">
            <svg width="18" height="14" viewBox="0 0 18 14" fill="none" aria-hidden="true">
              <rect x="0" y="0"   width="18" height="2.5" rx="1.25" fill="currentColor"/>
              <rect x="0" y="5.75" width="18" height="2.5" rx="1.25" fill="currentColor"/>
              <rect x="0" y="11.5" width="18" height="2.5" rx="1.25" fill="currentColor"/>
            </svg>
            <span class="lh-icon-label">List</span>
          </button>
          <button class="lh-icon-btn" id="lh-grid-view" title="Grid View">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <rect x="0"    y="0"    width="4.5" height="4.5" rx="0.75" fill="currentColor"/>
              <rect x="5.75" y="0"    width="4.5" height="4.5" rx="0.75" fill="currentColor"/>
              <rect x="11.5" y="0"    width="4.5" height="4.5" rx="0.75" fill="currentColor"/>
              <rect x="0"    y="5.75" width="4.5" height="4.5" rx="0.75" fill="currentColor"/>
              <rect x="5.75" y="5.75" width="4.5" height="4.5" rx="0.75" fill="currentColor"/>
              <rect x="11.5" y="5.75" width="4.5" height="4.5" rx="0.75" fill="currentColor"/>
              <rect x="0"    y="11.5" width="4.5" height="4.5" rx="0.75" fill="currentColor"/>
              <rect x="5.75" y="11.5" width="4.5" height="4.5" rx="0.75" fill="currentColor"/>
              <rect x="11.5" y="11.5" width="4.5" height="4.5" rx="0.75" fill="currentColor"/>
            </svg>
            <span class="lh-icon-label">Grid</span>
          </button>
        </div>
      </div>

      <div class="wc-overlay-body">
        <div id="wc-overlay-stage" class="wc-overlay-stage"></div>
        <div id="wc-overlay-art" class="wc-overlay-art" aria-hidden="true" hidden>
          <img id="wc-overlay-photo" class="wc-overlay-photo" src="" alt="" aria-hidden="true" hidden />
          <span class="wc-overlay-attribution" id="wc-overlay-attribution" hidden></span>
        </div>
      </div>
      <p class="wc-overlay-hint" hidden></p>

      <!-- List picker -->
      <div class="lh-picker" id="lh-list-picker" role="dialog" aria-label="Choose a city">
        <div class="lh-picker__inner">
          <div id="lh-list-picker-content"></div>
          <button class="lh-picker__back" id="lh-list-back">← Back</button>
        </div>
      </div>

      <!-- Grid picker -->
      <div class="lh-picker" id="lh-grid-picker" role="dialog" aria-label="Choose a city">
        <div class="lh-picker__inner">
          <h2 class="lh-grid-title">Latest Happenings</h2>
          <p class="lh-grid-subtitle">What Breakfast Club talked about</p>
          <div class="lh-cities-grid" id="lh-grid-picker-content"></div>
          <button class="lh-picker__back" id="lh-grid-back">← Back</button>
        </div>
      </div>
    </div>

    <script src="./js/analytics.js?v=20260523"></script>
    <script src="./js/club-overrides.js?v=20260523"></script>
    <script src="./js/wordcloud2.js?v=20260523"></script>
